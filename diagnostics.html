<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Diagnostics | Production · Compact diagnostics v1.2</title>
<style>
:root{--bg:#f7f6f3;--fg:#1a1915;--mut:#6b675e;--line:#dcd8cf;--card:#fff;--acc:#2f5fd8;--bad:#b3261e}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--fg:#ece9e2;--mut:#9a958a;--line:#302e29;--card:#1f1e1a;--acc:#8ab0ff;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#171613;--fg:#ece9e2;--mut:#9a958a;--line:#302e29;--card:#1f1e1a;--acc:#8ab0ff;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px 64px}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
p.sub{color:var(--mut);margin:0 0 20px}
button{font:inherit;padding:7px 13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
tr.grow td{color:var(--bad);font-weight:600}
.meta{color:var(--mut);font-size:12px}
.empty{color:var(--mut);padding:28px 0;text-align:center}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
</style></head><body><div class="wrap">
<h1>Resource ledger</h1><div style="color:#1768d2;font-weight:600;margin:0 0 8px">Production · Compact diagnostics v1.2</div>
<p class="sub">Sessions recorded by the bed composer, including ones that ended in a crash. Byte figures are estimates from each object's own shape, not measured native memory.</p>
<div class="bar">
  <button id="reload">Reload</button>
  <button id="emergency">Export crash recovery JSON</button>
  <button id="json">Export compact JSON</button>
  <button id="csv">Export full CSV</button>
  <button id="clear">Clear history</button>
</div>
<div id="status" class="meta" role="status" aria-live="polite"></div>
<div id="out"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let DB=null,SESS=[],SNAPS=Object.create(null),COUNTS=Object.create(null),busy=false,openPending=null;
const TIMEOUT=8000,DISPLAY_LIMIT=25;
const status=t=>{$('#status').textContent=t};
function local(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function checkpoint(){return local('pbc.diag.last')}
function recovery(){return {format:'pbc-crash-recovery-v1',exportedAt:new Date().toISOString(),checkpoint:checkpoint(),previousCheckpoint:local('pbc.diag.last.previous'),breadcrumbs:local('pbc.diag.breadcrumbs'),previousBreadcrumbs:local('pbc.diag.breadcrumbs.previous'),previousCrash:local('pbc.lastcrash'),storage:local('pbc.diag.storage')}}
function open(){if(DB)return Promise.resolve(DB);if(openPending)return openPending;openPending=new Promise((resolve,reject)=>{
  let q,done=false;
  const finish=(error,db)=>{if(done)return;done=true;clearTimeout(timer);if(error)reject(error);else resolve(db)};
  const timer=setTimeout(()=>finish(new Error('Database open timed out. Close other diagnostics/composer tabs and retry.')),TIMEOUT);
  try{q=indexedDB.open('pbc-diag')}catch(e){finish(e);return}
  q.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'sid'});
    if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{autoIncrement:true}).createIndex('sid','sid');
    if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{autoIncrement:true}).createIndex('sid','sid')};
  q.onsuccess=()=>{DB=q.result;openPending=null;DB.onversionchange=()=>{DB?.close();DB=null};DB.onclose=()=>{DB=null};finish(null,DB);if(done&&!busy)status('Database connection recovered. Select Reload to read history.')};q.onerror=()=>{openPending=null;finish(q.error||new Error('Database open failed'))};
  q.onblocked=()=>finish(new Error('Database is blocked by another tab. Close it and retry.'));
});return openPending}
function read(store,setup,timeout=TIMEOUT,mode='readonly'){return new Promise((resolve,reject)=>{
  let tx,done=false;
  const finish=(e,v)=>{if(done)return;done=true;clearTimeout(timer);e?reject(e):resolve(v)};
  const timer=setTimeout(()=>{finish(new Error(store+' read/write timed out'));try{tx.abort()}catch{}},timeout);
  try{tx=DB.transaction(store,mode);let value;tx.oncomplete=()=>finish(null,value);tx.onerror=tx.onabort=()=>finish(tx.error||new Error(store+' transaction failed'));
    setup(tx.objectStore(store),v=>{value=v});
  }catch(e){finish(e)}
})}
const validSnap=s=>s&&typeof s==='object'&&Number.isFinite(s.t);
function allSessions(){return read('sessions',(os,set)=>{const q=os.getAll();q.onsuccess=()=>set((q.result||[]).filter(s=>s&&typeof s.sid==='string'&&Number.isFinite(s.started)))})}
function summaries(sessions){return read('snaps',(os,set)=>{const idx=os.index('sid'),snaps=Object.create(null),counts=Object.create(null);set({snaps,counts});
  for(const {sid} of sessions){const key=IDBKeyRange.only(sid),pair=[];snaps[sid]=pair;
    const count=idx.count(key);count.onsuccess=()=>{counts[sid]=count.result};
    for(const dir of ['next','prev']){const q=idx.openCursor(key,dir);q.onsuccess=()=>{const cur=q.result;if(!cur)return;const snap=cur.value?.s;if(!validSnap(snap)){cur.continue();return}pair.push(snap);pair.sort((a,b)=>a.t-b.t);if(pair.length===2&&pair[0].t===pair[1].t)pair.pop()}}
  }
})}
function visit(store,index,key,fn,timeout=60000){return read(store,(os,set)=>{let n=0;const q=(index?os.index(index):os).openCursor(key);q.onsuccess=()=>{const cur=q.result;if(!cur){set(n);return}fn(cur.value);n++;cur.continue()}},timeout)}
function mb(x){return Number.isFinite(x)?x.toFixed(1):'—'}
function controls(on){busy=on;for(const id of ['reload','json','csv','clear'])$('#'+id).disabled=on}
async function load(){
  if(busy)return;controls(true);status('Loading session summaries…');
  try{draw();await open();SESS=(await allSessions()).sort((a,b)=>b.started-a.started);const result=await summaries(SESS.slice(0,DISPLAY_LIMIT));SNAPS=result.snaps;COUNTS=result.counts;draw();status(SESS.length>DISPLAY_LIMIT?'Showing latest '+DISPLAY_LIMIT+' of '+SESS.length+' sessions. Full CSV includes all history.':SESS.length+' recorded session'+(SESS.length===1?'':'s')+'.')}
  catch(e){console.warn('[Diagnostics] History unavailable:',e.message||e);try{draw()}catch{}status('Recovery mode: IndexedDB history is unavailable. '+(e.message||e)+' Use Export crash recovery JSON now; no database connection is required.');}
  finally{controls(false)}
}
function draw(){
  const out=$('#out');out.replaceChildren();
  const recovered=recovery(),last=recovered.checkpoint;
  if(!SESS.length&&!Object.entries(recovered).some(([k,v])=>!['format','exportedAt','storage'].includes(k)&&v)){out.innerHTML='<div class="empty">No locally saved crash data found. IndexedDB history may still be available.</div>';return}
  SESS.sort((a,b)=>b.started-a.started);
  for(const s of SESS.slice(0,DISPLAY_LIMIT)){
    const snaps=SNAPS[s.sid]||[];
    const card=document.createElement('div');card.className='card';
    const first=snaps[0],lastS=snaps[snaps.length-1];
    const dur=lastS?(lastS.t/1000/60).toFixed(1):'0';
    card.innerHTML='<h2>'+(s.clean?'':'⚠ ')+s.sid+(s.clean?'':' — ended without closing')+'</h2>'+
      '<div class="meta">'+new Date(s.started).toLocaleString()+' · '+dur+' min · '+(COUNTS[s.sid]??snaps.length)+' snapshots'+
      (lastS?' · last heap '+(lastS.heap?lastS.heap.u+'/'+lastS.heap.l+' MB':'?')+' · '+lastS.beds+' beds · '+lastS.dom+' DOM nodes · stage '+lastS.stage:'')+'</div>';
    if(first&&lastS){
      const keys=new Set([...Object.keys(first.res||{}),...Object.keys(lastS.res||{})]);
      const rows=[...keys].map(k=>{
        const a=(first.res||{})[k]||{},b=(lastS.res||{})[k]||{};
        return {k,outA:a.out||0,outB:b.out||0,made:b.made||0,freed:b.freed||0,gc:b.gc||0,mb:b.mb||0,peak:b.peak||0,
                d:(b.out||0)-(a.out||0)};
      }).filter(r=>r.made).sort((x,y)=>y.d-x.d);
      const t=document.createElement('table');
      t.innerHTML='<tr><th>resource</th><th>made</th><th>released</th><th>collected</th><th>outstanding first</th><th>outstanding last</th><th>change</th><th>est MB</th><th>peak</th></tr>'+
        rows.map(r=>'<tr class="'+(r.d>20?'grow':'')+'"><td>'+r.k+'</td><td>'+r.made+'</td><td>'+r.freed+'</td><td>'+r.gc+'</td><td>'+r.outA+'</td><td>'+r.outB+'</td><td>'+(r.d>0?'+':'')+r.d+'</td><td>'+mb(r.mb)+'</td><td>'+r.peak+'</td></tr>').join('');
      card.append(t);
    }
    out.append(card);
  }
  if(last){const c=document.createElement('div');c.className='card';
    c.innerHTML='<h2>Emergency checkpoint</h2><div class="meta">The last second written before the page stopped, session '+last.sid+', '+new Date(last.at).toLocaleString()+'</div><pre style="overflow:auto;font-size:12px">'+
      JSON.stringify(last.snap??null,null,1).replace(/</g,'&lt;')+'</pre>';out.append(c)}
  for(const [k,label] of [['previousCheckpoint','Previous session checkpoint'],['previousBreadcrumbs','Previous session crash breadcrumbs'],['previousCrash','Previous crash log'],['breadcrumbs','Current session breadcrumbs'],['storage','Database status']]){const value=recovered[k];if(value==null)continue;const c=document.createElement('div');c.className='card';const d=document.createElement('details'),h=document.createElement('summary'),p=document.createElement('pre');h.textContent=label;p.style.cssText='overflow:auto;max-height:360px;font-size:12px';p.textContent=JSON.stringify(value,null,1);d.append(h,p);c.append(d);out.append(c)}
}
function dl(name,text,type){const b=new Blob(Array.isArray(text)?text:[text],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
$('#reload').onclick=load;
$('#emergency').onclick=()=>{dl('pbc-crash-recovery.json',JSON.stringify(recovery()),'application/json');};
function compact(data=SNAPS){
 const chosen=[...SESS].sort((a,b)=>b.started-a.started).slice(0,5),sessions=[];
 const emergency=checkpoint();
 for(const meta of chosen){
 const a=data[meta.sid]||[],first=a[0],last=a.at(-1),keep=new Set(),resources={},metrics={};
 if(a.length){keep.add(0);keep.add(a.length-1);for(let i=Math.max(0,a.length-15);i<a.length;i++)keep.add(i);
 for(let i=0;i<Math.min(40,a.length);i++)keep.add(Math.round(i*(a.length-1)/Math.max(1,Math.min(40,a.length)-1)));
 const changes=[];for(let i=1;i<a.length;i++)if(a[i].stage!==a[i-1].stage)changes.push(i);
 for(const i of changes.slice(-20)){keep.add(i);keep.add(i-1)}
 const track=(obj,k,v,i)=>{if(typeof v!=='number'||!Number.isFinite(v))return;let q=obj[k];if(!q)q=obj[k]={first:v,last:v,min:v,max:v,minAt:a[i].t,maxAt:a[i].t};q.last=v;if(v<q.min){q.min=v;q.minAt=a[i].t}if(v>q.max){q.max=v;q.maxAt=a[i].t}};
 const flat=(o,p,i)=>{if(!o||typeof o!=='object')return;for(const [k,v] of Object.entries(o)){if(typeof v==='number')track(metrics,p+k,v,i);else if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,p+k+'.',i)}};
 a.forEach((s,i)=>{flat(s.heap,'heap.',i);flat(s.native,'native.',i);flat(s.engine,'engine.',i);flat(s.stat,'stat.',i);track(metrics,'dom',s.dom,i);track(metrics,'beds',s.beds,i);for(const [k,v] of Object.entries(s.res||{})){const q=resources[k]||=( {} );for(const f of ['out','mb','made','freed','gc','peak','peakMb'])track(q,f,v[f],i)}});
 const columns=['t','stage','heapMB','nativeMB','dom','beds','audioMB','offline','nodes'];
 const timeline=[...keep].sort((x,y)=>x-y).map(i=>{const s=a[i],r=s.res||{};return [s.t,s.stage,s.heap?.u??null,s.native?.totalMB??null,s.dom,s.beds,Object.entries(r).filter(([k])=>/AudioBuffer|createBuffer|^node:Buffer$/.test(k)).reduce((n,[,v])=>n+(v.mb||0),0),r.OfflineAudioContext?.out??0,Object.entries(r).filter(([k])=>k.startsWith('node:')).reduce((n,[,v])=>n+(v.out||0),0)]});
 sessions.push({meta,snapshotCount:a.length,first,last,metrics,resources,columns,timeline});
 }else sessions.push({meta,snapshotCount:0});
 }return {format:'pbc-compact-v1',exportedAt:new Date().toISOString(),totalSessions:SESS.length,omittedSessions:Math.max(0,SESS.length-chosen.length),checkpoint:emergency,recovery:recovery(),sessions,notes:'Resource counts and bytes are estimates. Unclean exit does not prove a crash. Timeline sampled; extrema computed from every stored snapshot.'}
}
async function compactEvents(report){
 if(!DB)return;
 for(const s of report.sessions){const counts={},recent=[],important=[];s.events={counts,recent,important};
  await visit('events','sid',IDBKeyRange.only(s.meta.sid),row=>{for(const e of Array.isArray(row?.e)?row.e:[]){if(!e)continue;const key=e.s+':'+e.k;counts[key]=(counts[key]||0)+1;const data=[e.n,e.t,e.s,e.k,e.b,e.id,e.stage];recent.push(data);if(recent.length>30)recent.shift();if(e.s==='|'||/error|crash|worker|offlineaudio/i.test(e.k)){important.push(data);if(important.length>60)important.shift()}}});
 }
}
async function action(label,fn){if(busy)return;controls(true);status(label);try{await fn()}catch(e){console.error('[Diagnostics]',e);status('Operation failed: '+(e.message||e)+'. Retry using Reload.')}finally{controls(false)}}
$('#json').onclick=()=>action('Preparing compact export…',async()=>{
 const data=Object.create(null);let readError=null;
 try{await open();for(const meta of SESS.slice(0,5)){const a=[];data[meta.sid]=a;await visit('snaps','sid',IDBKeyRange.only(meta.sid),row=>{if(validSnap(row?.s))a.push(row.s)});a.sort((x,y)=>x.t-y.t)}}
 catch(e){readError=e.message||String(e)}
 const report=compact(data);if(!readError)try{await compactEvents(report)}catch(e){readError=e.message||String(e)}
 if(readError){report.partial=true;report.readError=readError}
 dl('pbc-diagnostics-compact.json',JSON.stringify(report),'application/json');status(readError?'Exported available diagnostics and checkpoint; partial history: '+readError:'Compact diagnostics exported.');
});
$('#csv').onclick=()=>action('Preparing full history CSV…',async()=>{
 await open();const chunks=[],lines=['session,t_ms,stage,heap_mb,dom,beds,resource,made,freed,collected,outstanding,est_mb'];
 const flush=()=>{if(lines.length){chunks.push(lines.join('\n')+'\n');lines.length=0}};
 const csv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 await visit('snaps',null,null,row=>{const s=row?.s;if(!validSnap(s))return;for(const [k,c] of Object.entries(s.res||{})){if(!c)continue;lines.push([row.sid,s.t,s.stage,s.heap?.u,s.dom,s.beds,k,c.made,c.freed,c.gc,c.out,c.mb].map(csv).join(','));if(lines.length>=1024)flush()}},120000);flush();
 dl('pbc-diagnostics.csv',chunks,'text/csv');status('Full CSV exported.');
});
$('#clear').onclick=()=>{if(busy||!confirm('Delete all recorded diagnostic sessions?'))return;action('Clearing diagnostic history…',async()=>{
 await open();await new Promise((resolve,reject)=>{let tx,done=false;const finish=e=>{if(done)return;done=true;clearTimeout(timer);e?reject(e):resolve()};const timer=setTimeout(()=>{finish(new Error('Clear timed out'));try{tx.abort()}catch{}},TIMEOUT);try{tx=DB.transaction(['sessions','snaps','events'],'readwrite');tx.oncomplete=()=>finish();tx.onerror=tx.onabort=()=>finish(tx.error||new Error('Clear failed'));for(const k of ['sessions','snaps','events'])tx.objectStore(k).clear()}catch(e){finish(e)}});
 try{for(const k of ['pbc.diag.last','pbc.diag.last.previous','pbc.diag.breadcrumbs','pbc.diag.breadcrumbs.previous','pbc.lastcrash','pbc.diag.storage'])localStorage.removeItem(k)}catch{}SESS=[];SNAPS=Object.create(null);COUNTS=Object.create(null);draw();status('History cleared. An open composer tab may continue recording.');
})};

load();
</script></body></html>
